<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexumID - Acceso</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
background:#05080d;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
}

.card{
width:100%;
max-width:430px;
background:#0d141d;
border:1px solid #263342;
border-radius:22px;
padding:30px;
}

.logo{
font-size:34px;
font-weight:bold;
}

.logo span{
color:#1595ff;
}

.subtitle{
color:#9aa4b5;
margin-top:7px;
margin-bottom:35px;
font-size:15px;
}

h1{
font-size:30px;
font-weight:400;
margin:0 0 25px;
}

label{
display:block;
color:#aeb8c7;
font-size:14px;
margin-bottom:7px;
}

input{
width:100%;
padding:16px;
margin-bottom:18px;
border-radius:11px;
border:1px solid #263342;
background:#080d13;
color:#fff;
font-size:16px;
outline:none;
}

input:focus{
border-color:#1595ff;
}

button{
width:100%;
padding:16px;
border:0;
border-radius:13px;
background:#1595ff;
color:#fff;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.6;
}

.error{
margin-top:18px;
background:#321414;
border:1px solid #743030;
color:#ff8888;
padding:15px;
border-radius:12px;
line-height:1.4;
}

.loading{
margin-top:18px;
text-align:center;
color:#9da8b8;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
NEXUM<span>ID</span>
</div>

<div class="subtitle">
IDENTIDAD DIGITAL VEHICULAR
</div>

<h1>
Acceso administrativo
</h1>

<form id="loginForm">

<label for="email">
Correo
</label>

<input
id="email"
type="email"
autocomplete="username"
placeholder="tu correo"
required
>

<label for="password">
Contraseña
</label>

<input
id="password"
type="password"
autocomplete="current-password"
placeholder="Tu contraseña"
required
>

<button
id="btnLogin"
type="submit"
>
INGRESAR
</button>

</form>

<div id="mensaje"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://tkrugleneazdeqhxxkvr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1oVup3kgJeyOfTw_-3TkiPib";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const form =
document.getElementById("loginForm");

const btn =
document.getElementById("btnLogin");

const mensaje =
document.getElementById("mensaje");


form.addEventListener(
"submit",
async function(event){

event.preventDefault();

mensaje.innerHTML =
'<div class="loading">Iniciando sesión...</div>';

btn.disabled=true;

const email =
document.getElementById("email")
.value
.trim();

const password =
document.getElementById("password")
.value;


try{

const resultado =
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});


if(resultado.error){

throw resultado.error;

}


mensaje.innerHTML =
'<div class="loading">Acceso correcto. Abriendo panel...</div>';


setTimeout(
function(){

window.location.href =
"panel.html";

},
500
);


}catch(error){

console.error(error);

mensaje.innerHTML =
'<div class="error">' +
'Correo o contraseña incorrectos.' +
'<br><br>' +
(error.message || "") +
'</div>';

btn.disabled=false;

}

});

</script>

</body>
</html>
