name: Load MFA recovery handler

on:
  push:
    paths:
      - '.github/workflows/load-mfa-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch salud.html
        run: |
          python - &lt;&lt;'PY'
          from pathlib import Path
          p = Path("salud.html")
          s = p.read_text(encoding="utf-8")
          tag = '&lt;script type="module" src="/salud-recovery-mfa.js?v=1"&gt;&lt;/script&gt;'
          if tag not in s:
              needle = '&lt;/script&gt;\n&lt;/main&gt;&lt;/body&gt;&lt;/html&gt;'
              if needle not in s:
                  raise SystemExit("salud.html closing block not found")
              s = s.replace(needle, '&lt;/script&gt;\n' + tag + '\n&lt;/main&gt;&lt;/body&gt;&lt;/html&gt;', 1)
              p.write_text(s, encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salud.html
          git commit -m "Load MFA recovery handler"
          git push
