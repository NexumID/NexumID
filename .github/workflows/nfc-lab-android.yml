name: NexumID NFC LAB APK
on:
  push:
    branches:
      - nfclab/build-20261109
    paths:
      - 'nfclab/**'
      - '.github/workflows/nfc-lab-android.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: yes | /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --licenses || true
      - run: /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p nfclab :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NexumID-NFC-LAB-0.1.1-instalable
          path: nfclab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
