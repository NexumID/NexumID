name: NexumID NFC LAB APK
on:
  push:
    branches:
      - nfclab/build-20261109
    paths:
      - 'nfclab/**'
      - '.github/workflows/nfc-lab-android.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar Android SDK
        shell: bash
        run: |
          SDK_DIR="$HOME/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-commandline-tools.zip
          unzip -q /tmp/android-commandline-tools.zip -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p nfclab :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NexumID-NFC-LAB-0.1.1-instalable
          path: nfclab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
