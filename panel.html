<script>

const SUPABASE_URL =

const tiposDocumentos = [

    },

    {

        nombre:"REVISIÓN TÉCNICA"
    },

        nombre:"PERMISO DE CIRCULACIÓN"
    },

    {

    },

    {
        tipo:"padron",
        nombre:"PADRÓN"
    }

];


let vehiculoActual = null;



// ==================================================
// MENSAJES
// ==================================================

function mostrarExito(texto){

    document.getElementById(
        "mensaje"
    ).innerHTML = `

        <div class="success">

            ${texto}

        </div>

    `;

}


function mostrarError(texto){

    document.getElementById(
        "mensaje"
    ).innerHTML = `

        <div class="error">

        </div>

    `;

}



function mostrarFormulario(){

    document
    .getElementById(
        "formularioVehiculo"
    )
    .classList
    .remove("hidden");

}


function ocultarFormulario(){

    document
    .getElementById(
        "formularioVehiculo"
    )
    .classList
    .add("hidden");

}



// ==================================================
// HASH
// ==================================================

async function generarHashSHA256(texto){

    const datos =
    new TextEncoder().encode(texto);

    const hashBuffer =
    await crypto.subtle.digest(
        "SHA-256",
        datos
    );

    return Array
    .from(
        new Uint8Array(hashBuffer)
    )
    .map(
        byte =>
        byte
        .toString(16)
        .padStart(2,"0")
    )
    .join("");

}



// ==================================================
// CREAR VEHICULO
// ==================================================

async function crearVehiculo(){

    try{

        const {
            data:sessionData,
            error:sessionError
        } =
        await supabaseClient
        .auth
        .getSession();


        if(sessionError)
            throw sessionError;


        if(
            !sessionData ||
            !sessionData.session
        ){

            alert(
                "La sesión expiró."
            );

            window.location.href =
            "admin.html";

            return;
        }


        const patente =
        document
        .getElementById("patente")
        .value
        .trim()
        .toUpperCase();


        const marca =
        document
        .getElementById("marca")
        .value
        .trim();


        const modelo =
        document
        .getElementById("modelo")
        .value
        .trim();


        const anio =
        document
        .getElementById("anio")
        .value;


        const color =
        document
        .getElementById("color")
        .value
        .trim();


        const contacto =
        document
        .getElementById("contacto")
        .value
        .trim();


        if(
            !patente ||
            !marca ||
            !modelo ||
            !anio ||
            !color
        ){

            mostrarError(
                "Completa todos los campos obligatorios."
            );

            return;
        }


        const {
            data:vehiculo,
            error:vehiculoError
        } =
        await supabaseClient
        .from("vehiculos")
        .insert({

            patente:patente,
            marca:marca,
            modelo:modelo,
            anio:parseInt(anio),
            color:color,
            contacto_emergencia:contacto

        })
        .select()
        .single();


        if(vehiculoError)
            throw vehiculoError;


        const pin =
        Math.floor(
            1000 +
            Math.random() * 9000
        ).toString();


        const pinHash =
        await generarHashSHA256(
            pin
        );


        const {
            error:accesoError
        } =
        await supabaseClient
        .from("vehiculo_acceso")
        .insert({

            vehiculo_id:
            vehiculo.id,

            pin_hash:
            pinHash,

            intentos:0,

            bloqueado_hasta:null

        });


        if(accesoError){

            await supabaseClient
            .from("vehiculos")
            .delete()
            .eq(
                "id",
                vehiculo.id
            );

            throw accesoError;
        }


        document.getElementById(
            "mensaje"
        ).innerHTML = `

            <div class="success">

                <strong>
                    ✓ VEHÍCULO CREADO
                </strong>

                <div class="pin-box">

                    <span class="pin-label">
                        PIN DE ACCESO
                    </span>

                    <span class="pin-number">
                        ${pin}
                    </span>

                </div>

                <br>

                Guarda este PIN para entregárselo
                al propietario.

            </div>

        `;


        document
        .getElementById("patente")
        .value = "";

        document
        .getElementById("marca")
        .value = "";

        document
        .getElementById("modelo")
        .value = "";

        document
        .getElementById("anio")
        .value = "";

        document
        .getElementById("color")
        .value = "";

        document
        .getElementById("contacto")
        .value = "";


        ocultarFormulario();

        await cargarVehiculos();


    }catch(error){

        console.error(
            "ERROR CREANDO VEHICULO:",
            error
        );

        mostrarError(
            "No se pudo crear el vehículo:<br><br>"
            +
            escapeHtml(
                error.message ||
                "Error desconocido"
            )
        );

    }

}



// ==================================================
// CARGAR VEHICULOS
// ==================================================

async function cargarVehiculos(){

    const contenedor =
    document.getElementById(
        "listaVehiculos"
    );


    if(!contenedor)
        return;


    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .from("vehiculos")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(error){

            contenedor.innerHTML = `

                <div class="error">

                    Error al cargar vehículos:

                    <br><br>

                    ${escapeHtml(
                        error.message
                    )}

                </div>

            `;

            return;
        }


        if(
            !data ||
            data.length === 0
        ){

            contenedor.innerHTML = `

                <div class="loading">

                    Todavía no hay vehículos registrados.

                </div>

            `;

            return;
        }


        contenedor.innerHTML = "";


        data.forEach(
            vehiculo => {

                const div =
                document.createElement(
                    "div"
                );

                div.className =
                "vehicle";


                div.innerHTML = `

                    <div class="vehicle-patente">

                        ${escapeHtml(
                            vehiculo.patente
                        )}

                    </div>

                    <div class="vehicle-name">

                        ${escapeHtml(
                            vehiculo.marca
                        )}

                        ${escapeHtml(
                            vehiculo.modelo
                        )}

                    </div>

                    <div class="vehicle-info">

                        Año:
                        ${vehiculo.anio}

                        <br>

                        Color:
                        ${escapeHtml(
                            vehiculo.color
                        )}

                    </div>

                    <div class="vehicle-buttons">

                        <button
                            class="btn-blue"
                            onclick="abrirDocumentosPorId('${vehiculo.id}')">

                            DOCUMENTOS

                        </button>

                        <button
                            class="btn-secondary"
                            onclick="verPerfil('${encodeURIComponent(vehiculo.patente)}')">

                            VER PERFIL

                        </button>

                    </div>

                `;


                contenedor.appendChild(
                    div
                );

            }
        );


    }catch(error){

        console.error(error);

        contenedor.innerHTML = `

            <div class="error">

                Error inesperado:

                <br><br>

                ${escapeHtml(
                    error.message ||
                    "Error desconocido"
                )}

            </div>

        `;

    }

}



// ==================================================
// ESCAPAR HTML
// ==================================================

function escapeHtml(text){

    if(
        text === null ||
        text === undefined
    )
        return "";


    return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}



// ==================================================
// ABRIR DOCUMENTOS
// ==================================================

async function abrirDocumentosPorId(
    id
){

    const {
        data,
        error
    } =
    await supabaseClient
    .from("vehiculos")
    .select("*")
    .eq(
        "id",
        id
    )
    .single();


    if(error){

        mostrarError(
            error.message
        );

        return;
    }


    abrirDocumentos(
        data
    );

}


async function abrirDocumentos(
    vehiculo
){

    vehiculoActual =
    vehiculo;


    document
    .getElementById(
        "vistaPanel"
    )
    .classList
    .add("hidden");


    document
    .getElementById(
        "vistaDocumentos"
    )
    .classList
    .remove("hidden");


    document
    .getElementById(
        "infoVehiculo"
    )
    .innerHTML = `

        <div class="vehicle">

            <div class="vehicle-patente">

                ${escapeHtml(
                    vehiculo.patente
                )}

            </div>

            <div class="vehicle-name">

                ${escapeHtml(
                    vehiculo.marca
                )}

                ${escapeHtml(
                    vehiculo.modelo
                )}

            </div>

            <div class="vehicle-info">

                Año:
                ${vehiculo.anio}

                <br>

                Color:
                ${escapeHtml(
                    vehiculo.color
                )}

            </div>

        </div>

    `;


    await cargarDocumentos();

}



// ==================================================
// CARGAR DOCUMENTOS
// ==================================================

async function cargarDocumentos(){

    const contenedor =
    document.getElementById(
        "listaDocumentos"
    );


    contenedor.innerHTML = `

        <div class="loading">

            Cargando documentos...

        </div>

    `;


    const {
        data,
        error
    } =
    await supabaseClient
    .from("documentos")
    .select("*")
    .eq(
        "vehiculo_id",
        vehiculoActual.id
    );


    if(error){

        contenedor.innerHTML = `

            <div class="error">

                Error al cargar documentos:

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;
    }


    contenedor.innerHTML = "";


    tiposDocumentos.forEach(
        tipo => {

            const documento =
            (data || []).find(
                d =>
                d.tipo === tipo.tipo
            );


            const div =
            document.createElement(
                "div"
            );


            div.className =
            "doc-card";


            if(documento){

                div.innerHTML = `

                    <div class="doc-title">

                        ${tipo.nombre}

                    </div>

                    <div class="doc-status">

                        ✓
                        ${escapeHtml(
                            documento.nombre
                        )}
