/* =========================================================
   ESCAPAR HTML
========================================================= */

function esc(x){

 return String(x ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* =========================================================
   OBTENER TOKEN
========================================================= */

function obtenerToken(){

 const almacenes = [
  localStorage,
  sessionStorage
 ];

 for(const storage of almacenes){

  for(let i=0;i<storage.length;i++){

   const key =
    storage.key(i);

   if(
    !key ||
    !key.includes("auth-token")
   )
    continue;

   try{

    const valor =
     storage.getItem(key);

    if(!valor)
     continue;

    const obj =
     JSON.parse(valor);


    if(
     obj &&
     obj.access_token
    ){

     return obj.access_token;

    }


    if(
     obj &&
     obj.currentSession &&
     obj.currentSession.access_token
    ){

     return obj.currentSession.access_token;

    }


   }catch(e){

    console.warn(
     "No se pudo leer sesión:",
     key
    );

   }

  }

 }

 return null;

}


/* =========================================================
   API SUPABASE
========================================================= */

async function api(url,opt={}){

 if(!token){

  token =
   obtenerToken();

 }


 if(!token){

  throw Error(
   "Sesión no encontrada. Vuelve a iniciar sesión."
  );

 }


 const headers =
  new Headers(
   opt.headers || {}
  );


 headers.set(
  "apikey",
  KEY
 );


 headers.set(
  "Authorization",
  "Bearer "+token
 );


 const respuesta =
  await fetch(
   url,
   {
    ...opt,
    headers
   }
  );


 const texto =
  await respuesta.text();


 let data = null;


 try{

  data =
   texto
    ? JSON.parse(texto)
    : null;

 }catch(e){

  data = texto;

 }


 if(!respuesta.ok){

  throw Error(
   data?.message ||
   data?.hint ||
   data?.details ||
   "Error HTTP "+respuesta.status
  );

 }


 return data;

}

  document.getElementById(
   "lista"
  );

   obtenerToken();

    "Sesión no encontrada. Vuelve a iniciar sesión."
   );

  const vehiculos =
   await api(
    REST+
    "/vehiculos?select=*&order=created_at.desc"
   );

   !vehiculos ||
   !vehiculos.length
  ){

   lista.innerHTML =
    '<div class="loading">'+

/* =========================================================
   REGENERAR PIN
========================================================= */

async function regenerarPIN(){

 if(!vehiculoActual)
  return;


 const patente =
  vehiculoActual.patente;


 if(
  !confirm(
   "¿Regenerar el PIN de "+
   patente+
   "?\n\n"+
   "El PIN anterior dejará de funcionar inmediatamente."
  )
 )
  return;


 try{

  const pin =
   String(
    Math.floor(
     1000+
     Math.random()*9000
    )
   );


  const hash =
   await sha(pin);


  await api(

   REST+
   "/vehiculo_acceso?vehiculo_id=eq."+
   encodeURIComponent(
    vehiculoActual.id
   ),

   {
    method:"PATCH",

    headers:{
     "Content-Type":
      "application/json",

     "Prefer":
      "return=minimal"
    },

    body:
     JSON.stringify({

      pin_hash:hash,

      intentos:0,

      bloqueado_hasta:null,

      updated_at:
       new Date().toISOString()

     })

   }

  );


  const detalle =
   document.getElementById(
    "detalleVehiculo"
   );


  detalle.innerHTML +=

   '<div class="success">'+

    "✓ PIN REGENERADO"+

    '<div class="pinbox">'+

     "NUEVO PIN DE ACCESO"+

     '<span class="pin">'+
      esc(pin)+
     "</span>"+

     "El PIN anterior ya no funciona."+

    "</div>"+

   "</div>";


 }catch(e){

  console.error(e);


  const detalle =
   document.getElementById(
    "detalleVehiculo"
   );


  detalle.innerHTML +=

   '<div class="error">'+

    "<strong>No se pudo regenerar el PIN.</strong>"+

    "<br><br>"+

    esc(e.message)+

   "</div>";

 }

}

  "hidden"
 );


 area.innerHTML =

  '<div class="qrbox">'+

   '<div style="color:#111;margin-top:12px;font-weight:bold">'+
    esc(
     vehiculoActual.patente

  document.getElementById(

 if(
  typeof QRCode ===
  "undefined"
 ){

  codigo.innerHTML =
   '<div style="color:#b00000;padding:10px">'+

 );

/* =========================================================
   SUBIR DOCUMENTO
========================================================= */

async function subirDocumento(
 tipo,
 nombre
){

 try{

  const input =
   document.getElementById(
    "file_"+tipo
   );


  if(
   !input ||
   !input.files.length
  ){

   mensajeDoc(
    "Selecciona un archivo primero."
   );

   return;

  }


  const file =
   input.files[0];


  if(
   file.size >
   6*1024*1024
  ){

   mensajeDoc(
    "El archivo supera los 6 MB."
   );

   return;

  }


  const ext =
   file.name.includes(".")
    ?
    file.name
     .split(".")
     .pop()
     .toLowerCase()
    :
    "bin";


  const ruta =
   vehiculoActual.patente+
   "/"+
   tipo+
   "_"+
   Date.now()+
   "."+
   ext;


  mensajeDoc(
   "Subiendo documento...",
   "success"
  );


  await api(

   STORAGE+
   "/object/documentos/"+
   ruta
    .split("/")
    .map(
     encodeURIComponent
    )
    .join("/"),

   {
    method:"POST",

    headers:{
     "Content-Type":
      file.type ||
      "application/octet-stream",

     "x-upsert":
      "false"
    },

    body:file

   }

  );


  await api(

   REST+
   "/documentos",

   {
    method:"POST",

    headers:{
     "Content-Type":
      "application/json",

     "Prefer":
      "return=minimal"
    },

    body:
     JSON.stringify({

      vehiculo_id:
       vehiculoActual.id,

      tipo:
       tipo,
