/* ==========================================

/* ==========================================
   ESCAPAR HTML
========================================== */

function esc(valor){

return String(valor ?? "")

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}

/* ==========================================
   OBTENER TOKEN DE SUPABASE
========================================== */

function obtenerToken(){

const almacenes = [

window.localStorage,

window.sessionStorage

];


for(const storage of almacenes){

for(let i=0;i<storage.length;i++){

const key = storage.key(i);

if(!key){
continue;
}


if(
key.includes("auth-token") ||
key.includes("supabase.auth.token")
){

try{

const raw = storage.getItem(key);

if(!raw){
continue;
}


const objeto = JSON.parse(raw);


if(
objeto &&
objeto.access_token
){

return objeto.access_token;

}


if(
objeto &&
objeto.currentSession &&
objeto.currentSession.access_token
){

return objeto.currentSession.access_token;

}


if(
objeto &&
objeto.session &&
objeto.session.access_token
){

return objeto.session.access_token;

}

}catch(error){

console.log(
"No se pudo leer sesión:",
error
);

}

}

}

}


return null;

}


/* ==========================================
   API REST SUPABASE
========================================== */

async function apiFetch(url,options={}){

if(!ACCESS_TOKEN){

ACCESS_TOKEN =
obtenerToken();

}


if(!ACCESS_TOKEN){

throw new Error(
"No encontramos la sesión de Supabase. Vuelve a iniciar sesión."
);

}


const headers =
new Headers(
options.headers || {}
);


headers.set(
"apikey",
SUPABASE_KEY
);


headers.set(
"Authorization",
"Bearer " + ACCESS_TOKEN
);


const respuesta =
await fetch(
url,
{
...options,
headers:headers
}
);


const texto =
await respuesta.text();


let datos = null;


try{

datos =
texto
? JSON.parse(texto)
: null;

}catch(error){

datos = texto;

}


if(!respuesta.ok){

const mensaje =

datos?.message ||

datos?.hint ||

datos?.details ||

datos?.error_description ||

(
typeof datos === "string"
? datos
: "Error HTTP " + respuesta.status
);


throw new Error(mensaje);

}


return datos;

}

/* ==========================================
   CREAR VEHÍCULO

async function crearVehiculo(){

try{

const patente =
document.getElementById(
"patente"
).value
.trim()
.toUpperCase();


const marca =
document.getElementById(
"marca"
).value
.trim();


const modelo =
document.getElementById(
"modelo"
).value
.trim();


const anio =
document.getElementById(
"anio"
).value;


const color =
document.getElementById(
"color"
).value
.trim();


const contacto =
document.getElementById(
"contacto"
).value
.trim();


if(
!patente ||
!marca ||
!modelo ||
!anio ||
!color
){

mostrarError(
"Completa todos los campos obligatorios."
);

return;

}


/* Crear vehículo */

const resultado =

await apiFetch(

REST_BASE +
"/vehiculos",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:JSON.stringify({

patente:patente,

marca:marca,

modelo:modelo,

anio:parseInt(anio),

color:color,

contacto_emergencia:
contacto

})

}

);


const vehiculo =
Array.isArray(resultado)
? resultado[0]
: resultado;


/* Generar PIN */

const pin =

Math.floor(
1000 +
Math.random() *
9000
).toString();


const hash =
await sha256(pin);


/* Guardar PIN */

try{

await apiFetch(

REST_BASE +
"/vehiculo_acceso",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

},

body:JSON.stringify({

vehiculo_id:
vehiculo.id,

pin_hash:
hash,

intentos:0,

bloqueado_hasta:null

})

}

);

}catch(error){

/*
Si falla la creación del PIN,
eliminamos el vehículo recién creado.
*/

try{

await apiFetch(

REST_BASE +
"/vehiculos?id=eq." +
encodeURIComponent(
vehiculo.id

);

"mensaje"

'<div class="success">' +

'<strong>✓ VEHÍCULO CREADO</strong>' +

'<div class="pin-box">' +

'<span class="pin-label">' +

'PIN DE ACCESO' +

'</span>' +

'<span class="pin-number">' +

pin +

"anio",
"color",
"contacto"

id => {

/* ==========================================
   SHA-256
========================================== */

async function sha256(texto){

const buffer =

await crypto.subtle.digest(

"SHA-256",

new TextEncoder().encode(
texto
)

);


return Array.from(
new Uint8Array(buffer)
)

.map(

byte =>
byte
.toString(16)
.padStart(2,"0")

)

.join("");

}

/* ==========================================
   SUBIR DOCUMENTO
========================================== */

async function subirDocumento(
tipo,
nombre
){

try{

const input =
document.getElementById(
"archivo_" + tipo
);


if(
!input ||
!input.files ||
!input.files.length
){

mostrarMensajeDocumento(
"Selecciona un archivo primero.",
false
);

return;

}


const archivo =
input.files[0];


if(
archivo.size >
6 * 1024 * 1024
){

mostrarMensajeDocumento(
"El archivo supera el límite de 6 MB.",
false
);

return;

}


const extension =

archivo.name.includes(".")

?

archivo.name
.split(".")
.pop()
.toLowerCase()

:

"bin";


const ruta =

vehiculoActual.patente +

"/" +

tipo +

"_" +

Date.now() +

"." +

extension;


mostrarMensajeDocumento(
"Subiendo documento...",
true
);


/* Subir Storage */

await apiFetch(

STORAGE_BASE +

"/object/documentos/" +

ruta
.split("/")
.map(
encodeURIComponent
)
.join("/"),

{

method:"POST",

headers:{

"Content-Type":
archivo.type ||
"application/octet-stream",

"x-upsert":
"false"

},

body:archivo

}

);


/* Guardar registro */

try{

await apiFetch(

REST_BASE +
"/documentos",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

},

body:JSON.stringify({

vehiculo_id:
vehiculoActual.id,

tipo:tipo,

nombre:
archivo.name,

archivo:
ruta,

protegido:false

})

}

);

}catch(error){

try{

await apiFetch(

STORAGE_BASE +
"/object/remove/documentos",

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify([
ruta
])

}

);

}catch(_){}


throw error;

}


mostrarMensajeDocumento(
nombre +
" subido correctamente.",
true
);


await cargarDocumentos();


}catch(error){

console.error(error);


mostrarMensajeDocumento(

"Error al subir: " +
error.message,

false

);

}

}


/* ==========================================
   VER DOCUMENTO
========================================== */

async function verDocumento(
rutaCodificada
){

try{

const ruta =
decodeURIComponent(
rutaCodificada
);


const resultado =

await apiFetch(

STORAGE_BASE +

"/object/sign/documentos/" +

ruta
.split("/")
.map(
encodeURIComponent
)
.join("/"),

{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:JSON.stringify({

expiresIn:300

})

}

);


const signedURL =

resultado?.signedURL ||

resultado?.signedUrl;


if(!signedURL){

throw new Error(
"No se pudo generar el enlace."
);

}


const url =

signedURL.startsWith("http")

?

signedURL

:

STORAGE_BASE +
signedURL;


window.open(
url,
"_blank"
);


}catch(error){

mostrarMensajeDocumento(

"No se pudo abrir el documento: " +

error.message,

false

);

}

}

idCodificado,
rutaCodificada

!confirm(
"¿Eliminar este documento?"
)
){

return;

}


try{

const id =
decodeURIComponent(
idCodificado
);


const ruta =
decodeURIComponent(
rutaCodificada
);


/* Eliminar registro */

await apiFetch(

REST_BASE +
"/documentos?id=eq." +

encodeURIComponent(id),

{

method:"DELETE"

}

);


/* Eliminar archivo */

try{

await apiFetch(

STORAGE_BASE +
"/object/remove/documentos",

{

method:"POST",
