<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexumID - Prueba</title>

<style>
body{
    margin:0;
    background:#05080d;
    color:white;
    font-family:Arial,sans-serif;
    padding:30px;
}
button{
    display:block;
    width:100%;
    padding:18px;
    margin:15px 0;
    border:0;
    border-radius:14px;
    background:#1595ff;
    color:white;
    font-size:18px;
    font-weight:bold;
}
#resultado{
    margin-top:25px;
    padding:20px;
    border-radius:14px;
    background:#0d3026;
    border:1px solid #197553;
    color:#65e3b1;
}
</style>
</head>

<body>

<h1>NexumID</h1>

<p>PRUEBA DE JAVASCRIPT</p>

<button id="btnPrueba">
PROBAR JAVASCRIPT
</button>

<button id="btnSalir">
SALIR
</button>

<div id="resultado">
Esperando prueba...
</div>

<script>

document.getElementById("btnPrueba").addEventListener("click", function(){

    document.getElementById("resultado").textContent =
        "✓ JAVASCRIPT FUNCIONANDO CORRECTAMENTE";

});

document.getElementById("btnSalir").addEventListener("click", function(){

    document.getElementById("resultado").textContent =
        "✓ EL BOTÓN SALIR FUNCIONA";

});

</script>

</body>
</html>
