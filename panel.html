<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NexumID - Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#05080d;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:20px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.logo{
    font-size:24px;
    font-weight:bold;
    letter-spacing:1px;
}

.logo span{
    color:#078cff;
}

.subtitle{
    color:#9da9b8;
    font-size:12px;
    margin-top:4px;
}

.logout{
    border:1px solid #263444;
    background:#101720;
    color:#fff;
    border-radius:8px;
    padding:10px 14px;
    cursor:pointer;
}

/* TITULOS */

.title{
    font-size:22px;
    margin-bottom:18px;
}

/* BOTON NUEVO */

.new-button{
    width:100%;
    border:0;
    background:#078cff;
    color:white;
    padding:15px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:25px;
}

.new-button:active{
    opacity:.8;
}

/* FORMULARIO */

.form-box{
    display:none;
    background:#0d141e;
    border:1px solid #1d2a38;
    border-radius:12px;
    padding:20px;
    margin-bottom:25px;
}

.form-box.active{
    display:block;
}

.form-title{
    font-size:18px;
    margin-bottom:18px;
}

label{
    display:block;
    font-size:13px;
    color:#aeb9c7;
    margin-bottom:6px;
}

input{
    width:100%;
    background:#080d13;
    color:white;
    border:1px solid #263544;
    border-radius:8px;
    padding:13px;
    margin-bottom:15px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#078cff;
}

.save-button{
    width:100%;
    background:#24d98b;
    color:#06120d;
    border:0;
    padding:14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.save-button:disabled{
    opacity:.6;
}

.cancel-button{
    width:100%;
    background:#151d27;
    color:white;
    border:1px solid #293747;
    padding:13px;
    border-radius:8px;
    margin-top:10px;
    cursor:pointer;
}

/* VEHICULOS */

.vehicle-card{
    background:#0d141e;
    border:1px solid #1d2a38;
    border-radius:12px;
    padding:18px;
    margin-bottom:14px;
}

.vehicle-patente{
    font-size:20px;
    font-weight:bold;
    color:#078cff;
    margin-bottom:6px;
}

.vehicle-name{
    font-size:16px;
    margin-bottom:5px;
}

.vehicle-info{
    color:#9da9b8;
    font-size:13px;
    margin-bottom:15px;
}

.vehicle-actions{
    display:flex;
    gap:10px;
}

.action{
    flex:1;
    padding:11px;
    border-radius:8px;
    border:1px solid #263544;
    background:#111923;
    color:#fff;
    cursor:pointer;
}

.documents{
    color:#078cff;
}

/* MENSAJES */

.message{
    text-align:center;
    color:#8f9aaa;
    padding:30px 10px;
}

.error{
    background:#301719;
    border:1px solid #713034;
    color:#ff9a9f;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    display:none;
}

.success{
    background:#102b21;
    border:1px solid #1e6549;
    color:#62e8ae;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    display:none;
}

/* MOVIL */

@media(max-width:600px){

    .container{
        padding:15px;
    }

    .header{
        align-items:flex-start;
    }

    .logo{
        font-size:21px;
    }

    .vehicle-actions{
        flex-direction:column;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div>

            <div class="logo">
                NEXUM<span>ID</span>
            </div>

            <div class="subtitle">
                IDENTIDAD DIGITAL VEHICULAR
            </div>

        </div>

        <button
            class="logout"
            onclick="cerrarSesion()">

            SALIR

        </button>

    </div>


    <!-- TITULO -->

    <div class="title">
        Panel de Administración
    </div>


    <!-- MENSAJES -->

    <div
        id="error"
        class="error">
    </div>

    <div
        id="success"
        class="success">
    </div>


    <!-- NUEVO VEHICULO -->

    <button
        class="new-button"
        onclick="mostrarFormulario()">

        + NUEVO VEHÍCULO

    </button>


    <!-- FORMULARIO -->

    <div
        id="formulario"
        class="form-box">

        <div class="form-title">
            Registrar vehículo
        </div>


        <label>
            Patente
        </label>

        <input
            id="patente"
            type="text"
            placeholder="Ej: AB-CD-12"
            autocomplete="off">


        <label>
            Marca
        </label>

        <input
            id="marca"
            type="text"
            placeholder="Ej: Chevrolet"
            autocomplete="off">


        <label>
            Modelo
        </label>

        <input
            id="modelo"
            type="text"
            placeholder="Ej: Sail"
            autocomplete="off">


        <label>
            Año
        </label>

        <input
            id="anio"
            type="number"
            placeholder="Ej: 2020"
            inputmode="numeric">


        <label>
            Color
        </label>

        <input
            id="color"
            type="text"
            placeholder="Ej: Blanco"
            autocomplete="off">


        <label>
            Contacto de emergencia
        </label>

        <input
            id="contacto"
            type="text"
            placeholder="Ej: +56912345678"
            autocomplete="off">


        <button
            class="save-button"
            onclick="crearVehiculo()">

            CREAR VEHÍCULO

        </button>


        <button
            class="cancel-button"
            onclick="ocultarFormulario()">

            CANCELAR

        </button>

    </div>


    <!-- LISTA -->

    <div class="title">
        Vehículos registrados
    </div>


    <div id="listaVehiculos">

        <div class="message">
            Cargando vehículos...
        </div>

    </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://tkrugleneazdeqhxxkvr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1oVup3kgJeyOfHFoZeAfTw_-3TkiPib";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   INICIO
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    iniciar
);


async function iniciar(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .getSession();


        if(
            error ||
            !data ||
            !data.session
        ){

            window.location.href =
                "admin.html";

            return;
        }


        const {
            data: userData,
            error: userError
        } =
        await supabaseClient
        .auth
        .getUser();


        if(
            userError ||
            !userData ||
            !userData.user
        ){

            await supabaseClient
                .auth
                .signOut();

            window.location.href =
                "admin.html";

            return;
        }


        cargarVehiculos();


    }catch(error){

        console.error(
            "Error iniciando panel:",
            error
        );

        window.location.href =
            "admin.html";

    }

}


/* =========================================
   CARGAR VEHICULOS
========================================= */

async function cargarVehiculos(){

    const contenedor =
        document.getElementById(
            "listaVehiculos"
        );


    contenedor.innerHTML =
        '<div class="message">Cargando vehículos...</div>';


    const {
        data,
        error
    } =
    await supabaseClient
    .from("vehiculos")
    .select("*")
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        console.error(
            "Error cargando vehículos:",
            error
        );


        mostrarError(
            "No se pudieron cargar los vehículos: "
            + error.message
        );


        contenedor.innerHTML =
            '<div class="message">Error al cargar vehículos.</div>';


        return;
    }


    if(
        !data ||
        data.length === 0
    ){

        contenedor.innerHTML =
            '<div class="message">Todavía no hay vehículos registrados.</div>';

        return;
    }


    contenedor.innerHTML = "";


    data.forEach(
        vehiculo => {

            const tarjeta =
                document.createElement(
                    "div"
                );


            tarjeta.className =
                "vehicle-card";


            tarjeta.innerHTML = `

                <div class="vehicle-patente">
                    ${escapeHTML(
                        vehiculo.patente || ""
                    )}
                </div>


                <div class="vehicle-name">
                    ${escapeHTML(
                        vehiculo.marca || ""
                    )}
                    ${escapeHTML(
                        vehiculo.modelo || ""
                    )}
                </div>


                <div class="vehicle-info">

                    Año:
                    ${escapeHTML(
                        String(
                            vehiculo.anio || ""
                        )
                    )}

                    <br>

                    Color:
                    ${escapeHTML(
                        vehiculo.color || ""
                    )}

                </div>


                <div class="vehicle-actions">

                    <button
                        class="action documents"
                        onclick="verDocumentos('${vehiculo.id}')">

                        DOCUMENTOS

                    </button>


                    <button
                        class="action"
                        onclick="verVehiculo('${vehiculo.patente}')">

                        VER PERFIL

                    </button>

                </div>

            `;


            contenedor.appendChild(
                tarjeta
            );

        }
    );

}


/* =========================================
   CREAR VEHICULO
========================================= */

async function crearVehiculo(){

    ocultarMensajes();


    const boton =
        document.querySelector(
            ".save-button"
        );


    /*
     * COMPROBAR SESIÓN
     */

    boton.disabled =
        true;

    boton.innerText =
        "COMPROBANDO...";


    const {
        data: sessionData,
        error: sessionError
    } =
    await supabaseClient
    .auth
    .getSession();


    if(
        sessionError ||
        !sessionData ||
        !sessionData.session
    ){

        boton.disabled =
            false;

        boton.innerText =
            "CREAR VEHÍCULO";


        mostrarError(
            "La sesión expiró. Ingresa nuevamente."
        );


        setTimeout(
            function(){

                window.location.href =
                    "admin.html";

            },
            1500
        );


        return;
    }


    /*
     * DATOS
     */

    const patente =
        document
        .getElementById("patente")
        .value
        .trim()
        .toUpperCase();


    const marca =
        document
        .getElementById("marca")
        .value
        .trim();


    const modelo =
        document
        .getElementById("modelo")
        .value
        .trim();


    const anio =
        document
        .getElementById("anio")
        .value
        .trim();


    const color =
        document
        .getElementById("color")
        .value
        .trim();


    const contacto =
        document
        .getElementById("contacto")
        .value
        .trim();


    /*
     * VALIDACIÓN
     */

    if(
        !patente ||
        !marca ||
        !modelo ||
        !anio
    ){

        boton.disabled =
            false;

        boton.innerText =
            "CREAR VEHÍCULO";


        mostrarError(
            "Completa patente, marca, modelo y año."
        );


        return;
    }


    /*
     * INSERT
     *
     * IMPORTANTE:
     * NO usamos .select()
     * NO usamos .single()
     */

    boton.innerText =
        "GUARDANDO...";


    const {
        error
    } =
    await supabaseClient
    .from("vehiculos")
    .insert({

        patente:
            patente,

        marca:
            marca,

        modelo:
            modelo,

        anio:
            parseInt(
                anio,
                10
            ),

        color:
            color,

        contacto_emergencia:
            contacto

    });


    /*
     * RESTAURAR BOTÓN
     */

    boton.disabled =
        false;

    boton.innerText =
        "CREAR VEHÍCULO";


    /*
     * ERROR
     */

    if(error){

        console.error(
            "ERROR SUPABASE:",
            error
        );


        mostrarError(
            "No se pudo crear el vehículo: "
            + error.message
        );


        return;
    }


    /*
     * ÉXITO
     */

    mostrarExito(
        "Vehículo creado correctamente."
    );


    limpiarFormulario();

    ocultarFormulario();

    cargarVehiculos();

}


/* =========================================
   FORMULARIO
========================================= */

function mostrarFormulario(){

    ocultarMensajes();


    document
    .getElementById(
        "formulario"
    )
    .classList
    .add("active");

}


function ocultarFormulario(){

    document
    .getElementById(
        "formulario"
    )
    .classList
    .remove("active");

}


function limpiarFormulario(){

    document
    .getElementById(
        "patente"
    )
    .value = "";


    document
    .getElementById(
        "marca"
    )
    .value = "";


    document
    .getElementById(
        "modelo"
    )
    .value = "";


    document
    .getElementById(
        "anio"
    )
    .value = "";


    document
    .getElementById(
        "color"
    )
    .value = "";


    document
    .getElementById(
        "contacto"
    )
    .value = "";

}


/* =========================================
   VER PERFIL
========================================= */

function verVehiculo(
    patente
){

    window.open(

        "index.html?patente="
        +
        encodeURIComponent(
            patente
        ),

        "_blank"

    );

}


/* =========================================
   DOCUMENTOS
========================================= */

function verDocumentos(
    id
){

    alert(
        "Aquí agregaremos el administrador de documentos de este vehículo."
    );

}


/* =========================================
   CERRAR SESIÓN
========================================= */

async function cerrarSesion(){

    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "admin.html";

}


/* =========================================
   MENSAJES
========================================= */

function mostrarError(
    texto
){

    const elemento =
        document.getElementById(
            "error"
        );


    elemento.innerText =
        texto;


    elemento.style.display =
        "block";

}


function mostrarExito(
    texto
){

    const elemento =
        document.getElementById(
            "success"
        );


    elemento.innerText =
        texto;


    elemento.style.display =
        "block";

}


function ocultarMensajes(){

    document.getElementById(
        "error"
    ).style.display =
        "none";


    document.getElementById(
        "success"
    ).style.display =
        "none";

}


/* =========================================
   SEGURIDAD HTML
========================================= */

function escapeHTML(
    texto
){

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>
</html>
