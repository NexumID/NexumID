<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NexumID | Panel Admin</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #050b14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #0d1526;
            border: 1px solid #17243b;
            border-radius: 18px;
            padding: 30px 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 34px;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .logo p {
            margin-top: 7px;
            font-size: 12px;
            letter-spacing: 2px;
            color: #078cff;
        }

        .logo-line {
            width: 55px;
            height: 3px;
            background: #078cff;
            margin: 15px auto 0;
            border-radius: 5px;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h2 {
            font-size: 20px;
        }

        .title p {
            margin-top: 7px;
            color: #8e9bb0;
            font-size: 14px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #a6b3c9;
        }

        .campo input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #25344f;
            background: #07101d;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        .campo input:focus {
            border-color: #078cff;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            margin-top: 5px;
            border: none;
            border-radius: 10px;
            background: #078cff;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .mensaje {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .error {
            color: #ff6464;
        }

        .cargando {
            opacity: 0.7;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #66748a;
            font-size: 11px;
        }

    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            <h1>NEXUMID</h1>
            <p>IDENTIDAD DIGITAL VEHICULAR</p>
            <div class="logo-line"></div>
        </div>

        <div class="title">
            <h2>Panel de Administración</h2>
            <p>Acceso exclusivo</p>
        </div>

        <form id="loginForm">

            <div class="campo">
                <label for="email">Correo electrónico</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Correo electrónico"
                    required
                >
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn-login"
                id="btnLogin"
            >
                INGRESAR
            </button>

        </form>

        <div
            id="mensaje"
            class="mensaje"
        ></div>

        <div class="footer">
            NexumID · by Smart Box Connect
        </div>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://tkrugleneazdeqhxxkvr.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_1oVup3kgJeyOfHFoZeAfTw_-3TkiPib";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const loginForm =
            document.getElementById("loginForm");

        const mensaje =
            document.getElementById("mensaje");

        const btnLogin =
            document.getElementById("btnLogin");


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;


                mensaje.textContent = "Iniciando sesión...";
                mensaje.className = "mensaje cargando";

                btnLogin.disabled = true;


                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({

                        email: email,
                        password: password

                    });


                if (error) {

                    console.error(error);

                    mensaje.textContent =
                        "Correo o contraseña incorrectos.";

                    mensaje.className =
                        "mensaje error";

                    btnLogin.disabled = false;

                    return;
                }


                if (data.session) {

                    window.location.href =
                        "panel.html";

                }

            }
        );

    </script>

</body>
</html>
