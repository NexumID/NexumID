<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexumID - Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#05080d;color:#fff;font-family:Arial,sans-serif}
.container{max-width:900px;margin:auto;padding:24px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px;gap:15px}
.logo{font-size:28px;font-weight:bold}.logo span{color:#1595ff}
.subtitle{color:#9aa4b5;margin-top:6px}
button{border:0;border-radius:14px;padding:16px 20px;font-size:16px;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{width:100%;background:#1595ff;color:#fff;font-weight:bold;font-size:20px}
.btn-secondary{background:#111923;color:#fff;border:1px solid #263342}
.btn-blue{background:#111923;color:#1595ff;border:1px solid #263342;width:100%}
.btn-danger{background:#111923;color:#ff7070;border:1px solid #743030;width:100%}
h1{font-size:36px;font-weight:400;margin-bottom:30px}
h2{font-size:28px;font-weight:400;margin-top:40px}
.form-card,.vehicle,.doc-card{background:#0d141d;border:1px solid #263342;border-radius:18px;padding:20px;margin-top:20px}
.vehicle{padding:28px}
input{width:100%;padding:15px;margin:8px 0 16px;border-radius:10px;border:1px solid #263342;background:#080d13;color:#fff;font-size:16px}
label{color:#aeb8c7;font-size:14px}
.vehicle-patente{font-size:30px;font-weight:bold;color:#1595ff}
.vehicle-name{font-size:20px;margin-top:10px}
.vehicle-info{color:#9da8b8;margin-top:10px;line-height:1.5}
.vehicle-buttons,.doc-actions{display:grid;gap:12px;margin-top:20px}
.success{background:#0d3026;border:1px solid #197553;color:#65e3b1;padding:18px;border-radius:14px;margin-bottom:20px}
.error{background:#321414;border:1px solid #743030;color:#ff8888;padding:18px;border-radius:14px;margin-bottom:20px}
.hidden{display:none!important}
.back{margin-bottom:25px}
.doc-title{font-size:20px;font-weight:bold}
.doc-status{color:#9da8b8;margin:8px 0 18px}
.loading{text-align:center;color:#9da8b8;padding:30px}
.pin-box{margin-top:15px;padding:18px;background:#080d13;border:1px solid #1595ff;border-radius:12px;text-align:center}
.pin-label{display:block;color:#9da8b8;font-size:14px;letter-spacing:2px}
.pin-number{display:block;font-size:38px;font-weight:bold;letter-spacing:8px;margin-top:8px}
.linkbox{word-break:break-all;background:#080d13;border:1px solid #263342;border-radius:12px;padding:14px;color:#9da8b8;margin-top:12px}
.qrbox{background:#fff;border-radius:14px;padding:18px;width:max-content;max-width:100%;margin:18px auto;text-align:center}
.photo-preview{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:14px;border:1px solid #263342}
.small-note{color:#718093;font-size:13px;line-height:1.5}
@media(max-width:600px){
.container{padding:16px}
.header{align-items:flex-start}
.logo{font-size:24px}
h1{font-size:30px}
h2{font-size:24px}
.vehicle{padding:20px}
}
</style>
</head>

<body>
<div class="container">

<div class="header">
<div>
<div class="logo">NEXUM<span>ID</span></div>
<div class="subtitle">IDENTIDAD DIGITAL VEHICULAR</div>
</div>
<button id="btnSalir" class="btn-secondary" type="button">SALIR</button>
</div>

<div id="vistaPanel">
<h1>Panel de Administración</h1>
<div id="mensaje"></div>

<button id="btnNuevo" class="btn-primary" type="button">+ NUEVO VEHÍCULO</button>

<div id="formularioVehiculo" class="form-card hidden">
<h2 style="margin-top:0">Nuevo vehículo</h2>

<label>Patente</label>
<input id="patente" placeholder="AB-CD-12" autocomplete="off">

<label>Marca</label>
<input id="marca" placeholder="Chevrolet">

<label>Modelo</label>
<input id="modelo" placeholder="Sail">

<label>Año</label>
<input id="anio" type="number" placeholder="2020">

<label>Color</label>
<input id="color" placeholder="Blanco">

<label>Contacto de emergencia</label>
<input id="contacto" placeholder="+56912345678">

<button id="btnCrear" class="btn-primary" type="button">CREAR VEHÍCULO</button>
<br><br>
<button id="btnCancelar" class="btn-secondary" style="width:100%" type="button">CANCELAR</button>
</div>

<h2>Vehículos registrados</h2>
<div id="listaVehiculos">
<div class="loading">Iniciando panel...</div>
</div>
</div>

<div id="vistaDocumentos" class="hidden">
<button id="btnVolver" class="btn-secondary back" type="button">← VOLVER</button>
<h1>Gestionar vehículo</h1>
<div id="infoVehiculo"></div>
<div id="mensajeDocumentos"></div>
<div id="listaDocumentos"></div>
</div>

</div>

<script>
(function(){

"use strict";

var SUPABASE_URL = "https://tkrugleneazdeqhxxkvr.supabase.co";
var SUPABASE_KEY = "sb_publishable_1oVup3kgJeyOfHFoZeAfTw_-3TkiPib";

var db = null;
var vehiculoActual = null;

var tipos = [
["soap","SOAP"],
["revision_tecnica","REVISIÓN TÉCNICA"],
["permiso_circulacion","PERMISO DE CIRCULACIÓN"],
["certificado_gases","CERTIFICADO DE GASES"],
["padron","PADRÓN"]
];

function $(id){
return document.getElementById(id);
}

function esc(x){
var s = String(x == null ? "" : x);
return s
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function mostrarMensaje(t,tipo){
if(!tipo) tipo="error";
$("mensaje").innerHTML='<div class="'+tipo+'">'+esc(t)+'</div>';
}

function mostrarDocMensaje(t,tipo){
if(!tipo) tipo="error";
$("mensajeDocumentos").innerHTML='<div class="'+tipo+'">'+esc(t)+'</div>';
}

function mostrarFormulario(){
$("formularioVehiculo").classList.remove("hidden");
$("patente").focus();
}

function ocultarFormulario(){
$("formularioVehiculo").classList.add("hidden");
}

async function hash(texto){
var b = await crypto.subtle.digest(
"SHA-256",
new TextEncoder().encode(texto)
);

return Array.from(new Uint8Array(b))
.map(function(x){return x.toString(16).padStart(2,"0");})
.join("");
}

async function comprobarSesion(){
var r = await db.auth.getSession();
if(r.error) throw r.error;
return !!(r.data && r.data.session);
}

async function crearVehiculo(){

try{

if(!await comprobarSesion()){
alert("La sesión expiró.");
location.href="admin.html";
return;
}

var patente=$("patente").value.trim().toUpperCase();
var marca=$("marca").value.trim();
var modelo=$("modelo").value.trim();
var anio=$("anio").value.trim();
var color=$("color").value.trim();
var contacto=$("contacto").value.trim();

if(!patente || !marca || !modelo || !anio || !color){
mostrarMensaje("Completa todos los campos obligatorios.");
return;
}

var r=await db.from("vehiculos")
.insert({
patente:patente,
marca:marca,
modelo:modelo,
anio:parseInt(anio,10),
color:color,
contacto_emergencia:contacto
})
.select()
.single();

if(r.error) throw r.error;

var pin=String(Math.floor(1000+Math.random()*9000));
var pin_hash=await hash(pin);

var a=await db.from("vehiculo_acceso")
.insert({
vehiculo_id:r.data.id,
pin_hash:pin_hash,
intentos:0,
bloqueado_hasta:null
});

if(a.error){
await db.from("vehiculos").delete().eq("id",r.data.id);
throw a.error;
}

["patente","marca","modelo","anio","color","contacto"].forEach(function(id){
$(id).value="";
});

ocultarFormulario();

$("mensaje").innerHTML=
'<div class="success"><strong>✓ VEHÍCULO CREADO</strong>'+
'<div class="pin-box">'+
'<span class="pin-label">PIN DE ACCESO</span>'+
'<span class="pin-number">'+esc(pin)+'</span>'+
'</div><br>Guarda este PIN para entregárselo al propietario.</div>';

await cargarVehiculos();

}catch(e){
console.error(e);
mostrarMensaje("No se pudo crear el vehículo: "+(e.message || e));
}

}

async function cargarVehiculos(){

var box=$("listaVehiculos");
box.innerHTML='<div class="loading">Cargando vehículos...</div>';

try{

var r=await db.from("vehiculos")
.select("*")
.order("created_at",{ascending:false});

if(r.error) throw r.error;

if(!r.data || !r.data.length){
box.innerHTML='<div class="loading">Todavía no hay vehículos registrados.</div>';
return;
}

box.innerHTML="";

r.data.forEach(function(v){

var card=document.createElement("div");
card.className="vehicle";

card.innerHTML=
'<div class="vehicle-patente">'+esc(v.patente)+'</div>'+
'<div class="vehicle-name">'+esc(v.marca)+" "+esc(v.modelo)+'</div>'+
'<div class="vehicle-info">Año: '+esc(v.anio)+
"<br>Color: "+esc(v.color)+'</div>';

var botones=document.createElement("div");
botones.className="vehicle-buttons";

var docs=document.createElement("button");
docs.className="btn-blue";
docs.type="button";
docs.textContent="GESTIONAR VEHÍCULO";
docs.addEventListener("click",function(){
abrirDocumentosPorId(v.id);
});

var perfil=document.createElement("button");
perfil.className="btn-secondary";
perfil.type="button";
perfil.textContent="VER PERFIL";
perfil.addEventListener("click",function(){
location.href="index.html?patente="+encodeURIComponent(v.patente);
});

botones.appendChild(docs);
botones.appendChild(perfil);
card.appendChild(botones);
box.appendChild(card);

});

}catch(e){

console.error(e);

box.innerHTML=
'<div class="error"><strong>Error al cargar vehículos</strong><br><br>'+
esc(e.message || e)+'</div>';

}

}

async function abrirDocumentosPorId(id){

try{

var r=await db.from("vehiculos")
.select("*")
.eq("id",id)
.single();

if(r.error) throw r.error;

await abrirDocumentos(r.data);

}catch(e){
mostrarMensaje(e.message || "No se pudo abrir el vehículo.");
}

}

async function abrirDocumentos(v){

vehiculoActual=v;

$("vistaPanel").classList.add("hidden");
$("vistaDocumentos").classList.remove("hidden");

$("infoVehiculo").innerHTML=
'<div class="vehicle">'+
'<div class="vehicle-patente">'+esc(v.patente)+'</div>'+
'<div class="vehicle-name">'+esc(v.marca)+" "+esc(v.modelo)+'</div>'+
'<div class="vehicle-info">Año: '+esc(v.anio)+
"<br>Color: "+esc(v.color)+
"<br>Contacto: "+esc(v.contacto_emergencia || "No registrado")+
'</div></div>'+

'<div class="vehicle-buttons">'+
'<button id="btnRegenerarPIN" class="btn-primary" type="button">🔄 REGENERAR PIN</button>'+
'<button id="btnEliminarVehiculo" class="btn-danger" type="button">ELIMINAR VEHÍCULO</button>'+
'</div>'+

'<div class="form-card">'+
'<h2 style="margin-top:0">Foto del vehículo</h2>'+
'<div class="small-note">Esta foto aparecerá integrada en la tarjeta del vehículo del perfil público.</div>'+
'<div id="fotoActual" style="margin-top:15px"></div>'+
'<input id="fotoVehiculo" type="file" accept="image/jpeg,image/png,image/webp">'+
'<button id="btnSubirFoto" class="btn-primary" type="button">SUBIR / CAMBIAR FOTO</button>'+
'<br><br>'+
'<button id="btnEliminarFoto" class="btn-danger" type="button">ELIMINAR FOTO</button>'+
'</div>'+

'<div class="form-card">'+
'<h2 style="margin-top:0">Acceso público</h2>'+
'<div class="small-note">Enlace que usarán el QR y la tarjeta NFC.</div>'+
'<div class="linkbox" id="enlacePublico"></div>'+
'<div class="vehicle-buttons">'+
'<button id="btnCopiarEnlace" class="btn-primary" type="button">COPIAR ENLACE</button>'+
'<button id="btnGenerarQR" class="btn-secondary" type="button">GENERAR QR</button>'+
'</div>'+
'<div id="qrArea" class="hidden"></div>'+
'</div>';

$("enlacePublico").textContent=crearEnlacePublico(v.patente);

$("btnRegenerarPIN").addEventListener("click",regenerarPIN);
$("btnEliminarVehiculo").addEventListener("click",eliminarVehiculo);
$("btnCopiarEnlace").addEventListener("click",copiarEnlace);
$("btnGenerarQR").addEventListener("click",mostrarQR);
$("btnSubirFoto").addEventListener("click",subirFotoVehiculo);
$("btnEliminarFoto").addEventListener("click",eliminarFotoVehiculo);

await mostrarFotoActual();
await cargarDocumentos();

window.scrollTo(0,0);

}

function crearEnlacePublico(patente){
return "https://nexumid.github.io/NexumID/?patente="+
encodeURIComponent(String(patente || "").toUpperCase());
}

async function copiarEnlace(){

var enlace=crearEnlacePublico(vehiculoActual.patente);

try{
await navigator.clipboard.writeText(enlace);
mostrarDocMensaje("✓ Enlace copiado.","success");
}catch(e){
prompt("Copia este enlace:",enlace);
}

}

function mostrarQR(){

var area=$("qrArea");
area.classList.remove("hidden");

area.innerHTML=
'<div class="qrbox">'+
'<div id="codigoQR"></div>'+
'<div style="color:#111;margin-top:12px;font-weight:bold">'+
esc(vehiculoActual.patente)+
'</div></div>';

var codigo=$("codigoQR");

if(typeof QRCode==="undefined"){
codigo.innerHTML=
'<div style="color:#b00000;padding:10px">No se pudo cargar el generador QR.</div>';
return;
}

new QRCode(codigo,{
text:crearEnlacePublico(vehiculoActual.patente),
width:220,
height:220,
correctLevel:QRCode.CorrectLevel.M
});

}

async function regenerarPIN(){

if(!vehiculoActual)return;

if(!confirm(
"¿Regenerar el PIN de "+vehiculoActual.patente+
"?\n\nEl PIN anterior dejará de funcionar inmediatamente."
))return;

var boton=$("btnRegenerarPIN");

try{

if(!await comprobarSesion()){
alert("La sesión expiró.");
location.href="admin.html";
return;
}

boton.disabled=true;
boton.textContent="GENERANDO NUEVO PIN...";

var pin=String(Math.floor(1000+Math.random()*9000));
var pin_hash=await hash(pin);

var resultado=await db
.from("vehiculo_acceso")
.update({
pin_hash:pin_hash,
intentos:0,
bloqueado_hasta:null,
updated_at:new Date().toISOString()
})
.eq("vehiculo_id",vehiculoActual.id)
.select("vehiculo_id,pin_hash,updated_at")
.single();

if(resultado.error) throw resultado.error;
if(!resultado.data) throw new Error("Supabase no devolvió la fila actualizada.");
if(resultado.data.vehiculo_id!==vehiculoActual.id) throw new Error("El PIN no corresponde al vehículo seleccionado.");
if(resultado.data.pin_hash!==pin_hash) throw new Error("Supabase no confirmó el nuevo PIN.");

$("mensajeDocumentos").innerHTML=
'<div class="success">'+
'<strong>✓ PIN REGENERADO CORRECTAMENTE</strong>'+
'<div class="pin-box">'+
'<span class="pin-label">NUEVO PIN DE ACCESO</span>'+
'<span class="pin-number">'+esc(pin)+'</span>'+
'</div>'+
'<br><strong>El PIN anterior ya dejó de funcionar.</strong>'+
'</div>';

boton.textContent="🔄 REGENERAR PIN";

}catch(e){

console.error("ERROR REGENERANDO PIN:",e);

$("mensajeDocumentos").innerHTML=
'<div class="error">'+
'<strong>NO SE PUDO REGENERAR EL PIN</strong><br><br>'+
esc(e.message || e)+
'<br><br>El PIN anterior se mantiene sin cambios.</div>';

boton.textContent="🔄 REGENERAR PIN";

}finally{
boton.disabled=false;
}

}

async function eliminarVehiculo(){

if(!vehiculoActual)return;

if(!confirm(
"¿ELIMINAR DEFINITIVAMENTE "+
vehiculoActual.patente+
"?\n\nSe eliminarán sus documentos, foto y acceso."
))return;

try{

var docs=await db.from("documentos")
.select("*")
.eq("vehiculo_id",vehiculoActual.id);

if(docs.error)throw docs.error;

for(var i=0;i<(docs.data || []).length;i++){
try{
await db.storage.from("documentos").remove([docs.data[i].archivo]);
}catch(e){}
}

var dr=await db.from("documentos")
.delete()
.eq("vehiculo_id",vehiculoActual.id);

if(dr.error)throw dr.error;

var foto=await db.from("vehiculos")
.select("foto_path")
.eq("id",vehiculoActual.id)
.single();

if(!foto.error && foto.data && foto.data.foto_path){
try{
await db.storage.from("vehiculos").remove([foto.data.foto_path]);
}catch(e){}
}

await db.from("vehiculo_acceso")
.delete()
.eq("vehiculo_id",vehiculoActual.id);

var vr=await db.from("vehiculos")
.delete()
.eq("id",vehiculoActual.id);

if(vr.error)throw vr.error;

vehiculoActual=null;

$("vistaDocumentos").classList.add("hidden");
$("vistaPanel").classList.remove("hidden");

mostrarMensaje("✓ VEHÍCULO ELIMINADO","success");

await cargarVehiculos();

}catch(e){
mostrarDocMensaje("No se pudo eliminar: "+(e.message || e));
}

}

async function mostrarFotoActual(){

var box=$("fotoActual");
if(!box)return;

box.innerHTML='<div class="loading">Cargando foto...</div>';

try{

var r=await db.from("vehiculos")
.select("foto_path")
.eq("id",vehiculoActual.id)
.single();

if(r.error)throw r.error;

if(!r.data || !r.data.foto_path){
box.innerHTML='<div class="small-note" style="padding:12px 0">No hay foto cargada.</div>';
return;
}

var signed=await db.storage
.from("vehiculos")
.createSignedUrl(r.data.foto_path,300);

if(signed.error)throw signed.error;

box.innerHTML=
'<img class="photo-preview" src="'+esc(signed.data.signedUrl)+'" alt="Foto del vehículo">'+
'<div style="color:#65e3b1;margin-top:10px;font-size:13px">✓ Foto cargada</div>';

}catch(e){

console.error(e);
box.innerHTML='<div class="error">No se pudo cargar la foto.<br><br>'+esc(e.message || e)+'</div>';

}

}

async function subirFotoVehiculo(){

var input=$("fotoVehiculo");

if(!input || !input.files || !input.files.length){
mostrarDocMensaje("Selecciona una foto.");
return;
}

var file=input.files[0];

if(["image/jpeg","image/png","image/webp"].indexOf(file.type)===-1){
mostrarDocMensaje("Solo JPG, PNG o WEBP.");
return;
}

if(file.size>5*1024*1024){
mostrarDocMensaje("La foto supera los 5 MB.");
return;
}

var boton=$("btnSubirFoto");

try{

boton.disabled=true;
boton.textContent="SUBIENDO FOTO...";

var anterior=await db.from("vehiculos")
.select("foto_path")
.eq("id",vehiculoActual.id)
.single();

if(anterior.error)throw anterior.error;

var ext=file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg";
var ruta=vehiculoActual.id+"/foto_"+Date.now()+"."+ext;

var upload=await db.storage
.from("vehiculos")
.upload(ruta,file,{
contentType:file.type,
upsert:false,
cacheControl:"3600"
});

if(upload.error)throw upload.error;

var update=await db.from("vehiculos")
.update({foto_path:ruta})
.eq("id",vehiculoActual.id)
.select("id,foto_path")
.single();

if(update.error){
await db.storage.from("vehiculos").remove([ruta]);
throw update.error;
}

if(anterior.data && anterior.data.foto_path){
try{
await db.storage.from("vehiculos").remove([anterior.data.foto_path]);
}catch(e){}
}

input.value="";
mostrarDocMensaje("✓ Foto del vehículo actualizada.","success");
await mostrarFotoActual();

}catch(e){

console.error(e);
mostrarDocMensaje("No se pudo subir la foto: "+(e.message || e));

}finally{

boton.disabled=false;
boton.textContent="SUBIR / CAMBIAR FOTO";

}

}

async function eliminarFotoVehiculo(){

if(!vehiculoActual)return;

if(!confirm("¿Eliminar la foto de "+vehiculoActual.patente+"?"))return;

try{

var r=await db.from("vehiculos")
.select("foto_path")
.eq("id",vehiculoActual.id)
.single();

if(r.error)throw r.error;

if(r.data && r.data.foto_path){

var s=await db.storage
.from("vehiculos")
.remove([r.data.foto_path]);

if(s.error)throw s.error;

}

var u=await db.from("vehiculos")
.update({foto_path:null})
.eq("id",vehiculoActual.id);

if(u.error)throw u.error;

mostrarDocMensaje("✓ Foto eliminada.","success");
await mostrarFotoActual();

}catch(e){

mostrarDocMensaje("No se pudo eliminar la foto: "+(e.message || e));

}

}

async function cargarDocumentos(){

var box=$("listaDocumentos");

box.innerHTML='<div class="loading">Cargando documentos...</div>';

try{

var r=await db.from("documentos")
.select("*")
.eq("vehiculo_id",vehiculoActual.id);

if(r.error)throw r.error;

box.innerHTML="";

tipos.forEach(function(t){

var doc=(r.data || []).find(function(x){
return x.tipo===t[0];
});

var card=document.createElement("div");
card.className="doc-card";

var title=document.createElement("div");
title.className="doc-title";
title.textContent=t[1];

var status=document.createElement("div");
status.className="doc-status";

card.appendChild(title);
card.appendChild(status);

if(doc){

status.textContent="✓ "+doc.nombre;

var actions=document.createElement("div");
actions.className="doc-actions";

var ver=document.createElement("button");
ver.className="btn-blue";
ver.type="button";
ver.textContent="VER DOCUMENTO";
ver.addEventListener("click",function(){
verDocumento(doc.archivo);
});

async function subirDocumento(tipo,nombre){

try{

var input=$("archivo_"+tipo);

if(!input || !input.files || !input.files.length){
mostrarDocMensaje("Selecciona un archivo.");
return;
}

var file=input.files[0];

if(file.size>6*1024*1024){
mostrarDocMensaje("El archivo supera los 6 MB.");
return;
}

var ext=file.name.indexOf(".")>=0?
file.name.split(".").pop().toLowerCase():"bin";

var ruta=vehiculoActual.patente+"/"+tipo+"_"+Date.now()+"."+ext;

var upload=await db.storage
.from("documentos")
.upload(ruta,file,{
contentType:file.type || "application/octet-stream",
upsert:false
});

if(upload.error)throw upload.error;

var insert=await db.from("documentos").insert({
vehiculo_id:vehiculoActual.id,
tipo:tipo,
nombre:file.name,
archivo:ruta,
protegido:true
});

if(insert.error){
await db.storage.from("documentos").remove([ruta]);
throw insert.error;
}

mostrarDocMensaje(nombre+" subido correctamente.","success");
await cargarDocumentos();

}catch(e){

mostrarDocMensaje("Error al subir: "+(e.message || e));

}

}

async function verDocumento(ruta){

try{

var r=await db.storage
.from("documentos")
.createSignedUrl(ruta,300);

if(r.error)throw r.error;

window.open(r.data.signedUrl,"_blank");

}catch(e){

mostrarDocMensaje("No se pudo abrir el documento: "+(e.message || e));

}

}

async function eliminarDocumento(id,ruta){

if(!confirm("¿Eliminar este documento?"))return;

try{

var r=await db.from("documentos")
.delete()
.eq("id",id);

if(r.error)throw r.error;

var s=await db.storage.from("documentos").remove([ruta]);

if(s.error)throw s.error;

mostrarDocMensaje("✓ Documento eliminado.","success");
await cargarDocumentos();

}catch(e){

mostrarDocMensaje("No se pudo eliminar: "+(e.message || e));

}

}

function volverPanel(){

vehiculoActual=null;

$("vistaDocumentos").classList.add("hidden");
$("vistaPanel").classList.remove("hidden");
$("mensajeDocumentos").innerHTML="";

cargarVehiculos();
window.scrollTo(0,0);

}

async function cerrarSesion(){

try{
if(db) await db.auth.signOut();
}catch(e){}

location.href="admin.html";

}

function prepararBotones(){

$("btnNuevo").addEventListener("click",mostrarFormulario);
$("btnCancelar").addEventListener("click",ocultarFormulario);
$("btnCrear").addEventListener("click",crearVehiculo);
$("btnSalir").addEventListener("click",cerrarSesion);
$("btnVolver").addEventListener("click",volverPanel);

}

async function iniciar(){

var box=$("listaVehiculos");

try{

box.innerHTML='<div class="loading">Conectando con NexumID...</div>';

if(typeof window.supabase==="undefined"){
throw new Error("No se cargó la librería de Supabase. Revisa la conexión a Internet.");
}

db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

var sesion=await comprobarSesion();

if(!sesion){

box.innerHTML='<div class="error"><strong>Sesión no encontrada.</strong><br><br>Redirigiendo al acceso...</div>';

setTimeout(function(){
location.href="admin.html";
},1200);

return;
}

await cargarVehiculos();

}catch(e){

console.error("NEXUMID PANEL ERROR:",e);

box.innerHTML=
'<div class="error">'+
'<strong>Error iniciando el panel</strong><br><br>'+
esc(e && e.message ? e.message : e)+
'<br><br>'+
'<span class="small-note">Si acabas de actualizar GitHub, espera unos minutos y recarga la página.</span>'+
'</div>';

}

}

prepararBotones();
iniciar();

})();
</script>
