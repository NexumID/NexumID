<script>

];


// VEHICULO ACTUAL

let vehiculoActual = null;


// MENSAJES

function mostrarExito(texto){

    document.getElementById("mensaje").innerHTML =

}

function mostrarError(texto){

    .getElementById("formularioVehiculo")

}


// GENERAR HASH SHA-256

async function generarHashSHA256(texto){

    const encoder =
    new TextEncoder();

    const datos =
    encoder.encode(texto);

    const hashBuffer =
    await crypto.subtle.digest(
        "SHA-256",
        datos
    );

    const hashArray =
    Array.from(
        new Uint8Array(hashBuffer)
    );

    return hashArray
    .map(
        byte =>
        byte
        .toString(16)
        .padStart(2,"0")
    )
    .join("");

}


// CREAR VEHICULO

async function crearVehiculo(){

    const {
        data: sessionData
    } = await supabaseClient.auth.getSession();


    if(!sessionData.session){

        alert("La sesión expiró.");
        window.location.href="admin.html";

        return;

    }


    const patente =
    document.getElementById("patente")
    .value
    .trim()
    .toUpperCase();

    const marca =
    document.getElementById("marca")
    .value
    .trim();

    const modelo =
    document.getElementById("modelo")
    .value
    .trim();

    const anio =
    document.getElementById("anio")
    .value;

    const color =
    document.getElementById("color")
    .value
    .trim();

    const contacto =
    document.getElementById("contacto")
    .value
    .trim();


    if(
        !patente ||
        !marca ||
        !modelo ||
        !anio ||
        !color
    ){

        mostrarError(
            "Completa todos los campos obligatorios."
        );

        return;
    }


    // ==========================================
    // CREAR VEHÍCULO
    // ==========================================

    const {
        data: vehiculo,
        error: vehiculoError
    } = await supabaseClient
    .from("vehiculos")
    .insert({

        patente:patente,
        marca:marca,
        modelo:modelo,
        anio:parseInt(anio),
        color:color,
        contacto_emergencia:contacto

    })
    .select()
    .single();


    if(vehiculoError){

        console.error(vehiculoError);

        mostrarError(
            "No se pudo crear el vehículo: "
            + vehiculoError.message
        );

        return;
    }


    // ==========================================
    // GENERAR PIN DE 4 DIGITOS
    // ==========================================

    const pin =
    Math.floor(
        1000 + Math.random() * 9000
    ).toString();


    // ==========================================
    // GENERAR HASH
    // ==========================================

    const pinHash =
    await generarHashSHA256(pin);


    // ==========================================
    // GUARDAR ACCESO
    // ==========================================

    const {
        error: accesoError
    } = await supabaseClient
    .from("vehiculo_acceso")
    .insert({

        vehiculo_id:vehiculo.id,

        pin_hash:pinHash,

        intentos:0,

        bloqueado_hasta:null

    });


    // ==========================================
    // SI FALLA EL ACCESO
    // ==========================================

    if(accesoError){

        console.error(accesoError);


        // Intentar eliminar el vehículo
        // para no dejarlo sin PIN.

        await supabaseClient
        .from("vehiculos")
        .delete()
        .eq("id",vehiculo.id);


        mostrarError(
            "No se pudo crear el acceso PIN: "
            + accesoError.message
        );

        return;
    }


    // ==========================================
    // MOSTRAR RESULTADO
    // ==========================================

    document.getElementById("mensaje").innerHTML = `

        <div class="success">

            <strong>
                Vehículo creado correctamente.
            </strong>

            <div class="pin-box">

                PIN DE ACCESO

                <span class="pin-number">
                    ${pin}
                </span>

            </div>

            <br>

            Guarda este PIN para entregárselo
            al propietario del vehículo.

        </div>

    `;


    // ==========================================
    // LIMPIAR FORMULARIO
    // ==========================================

    document.getElementById("patente").value="";
    document.getElementById("marca").value="";
    document.getElementById("modelo").value="";
    document.getElementById("anio").value="";
    document.getElementById("color").value="";
    document.getElementById("contacto").value="";


    ocultarFormulario();

    cargarVehiculos();

}


// CARGAR VEHICULOS

async function cargarVehiculos(){

    const {
        data,
        error
    } = await supabaseClient
    .from("vehiculos")
    .select("*")
    .order(
        "created_at",
        {ascending:false}
    );


    const contenedor =
    document.getElementById("listaVehiculos");


    if(error){

        console.error(error);

        contenedor.innerHTML =
        `<div class="error">
        Error al cargar vehículos:<br>
        ${error.message}
        </div>`;

        return;
    }


    if(!data || data.length===0){

        contenedor.innerHTML =
        `<div class="loading">
        Todavía no hay vehículos registrados.
        </div>`;

        return;
    }


    contenedor.innerHTML="";


    data.forEach(vehiculo=>{

        const div =
        document.createElement("div");

        div.className="vehicle";


        div.innerHTML=`

            <div class="vehicle-patente">
                ${escapeHtml(vehiculo.patente)}
            </div>

            <div class="vehicle-name">
                ${escapeHtml(vehiculo.marca)}
                ${escapeHtml(vehiculo.modelo)}
            </div>

            <div class="vehicle-info">

                Año:
                ${vehiculo.anio}

                <br>

                Color:
                ${escapeHtml(vehiculo.color)}

            </div>

            <div class="vehicle-buttons">

                <button
                    class="btn-blue"
                    onclick='abrirDocumentos(${JSON.stringify(vehiculo)})'>
                    DOCUMENTOS
                </button>

                <button
                    class="btn-secondary"
                    onclick='verPerfil(${JSON.stringify(vehiculo)})'>
                    VER PERFIL
                </button>

            </div>

        `;


        contenedor.appendChild(div);

    });

}


// ESCAPAR HTML

function escapeHtml(text){

    if(text===null || text===undefined)
        return "";

    return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

async function abrirDocumentos(vehiculo){

    vehiculoActual=vehiculo;


    document
    .getElementById("vistaPanel")
    .classList.add("hidden");


    document
    .getElementById("vistaDocumentos")
    .classList.remove("hidden");


    document
    .getElementById("infoVehiculo")
    .innerHTML=`

        <div class="vehicle">

            <div class="vehicle-patente">
                ${escapeHtml(vehiculo.patente)}
            </div>

            <div class="vehicle-name">

                ${escapeHtml(vehiculo.modelo)}

            <div class="vehicle-info">

                Año: ${vehiculo.anio}
                <br>
                Color: ${escapeHtml(vehiculo.color)}

    cargarDocumentos();

}


// CARGAR DOCUMENTOS

async function cargarDocumentos(){

    const contenedor =
    document.getElementById("listaDocumentos");


    contenedor.innerHTML =
    `<div class="loading">
    Cargando documentos...
    </div>`;


    const {
        data,
        error
    } = await supabaseClient
    .from("documentos")
    .select("*")
    .eq(
        "vehiculo_id",
        vehiculoActual.id
    );


    if(error){

        console.error(error);

        contenedor.innerHTML =
        `<div class="error">
        Error al cargar documentos:<br>
        ${error.message}
        </div>`;

        return;
    }


    contenedor.innerHTML="";


    tiposDocumentos.forEach(tipo=>{

        const documentos =
        data.filter(
            d => d.tipo === tipo.tipo
        );


        const documento =
        documentos.length
        ? documentos[0]
        : null;


        const div =
        document.createElement("div");

        div.className="doc-card";


        let contenido="";


        if(documento){

            contenido=`

                <div class="doc-title">
                    ${tipo.nombre}
                </div>

                <div class="doc-status">

                    ✓ ${escapeHtml(documento.nombre)}

                </div>

                <div class="doc-actions">

                    <button
                        class="btn-blue"
                        onclick="verDocumento('${escapeHtml(documento.archivo)}')">
                        VER DOCUMENTO
                    </button>

                    <button
                        class="btn-danger"
                        onclick="eliminarDocumento('${documento.id}','${escapeHtml(documento.archivo)}')">
                        ELIMINAR
                    </button>

                </div>

            `;

        }else{

            contenido=`

                <div class="doc-title">
                    ${tipo.nombre}
                </div>

                <div class="doc-status">
                    Sin documento
                </div>

                <div class="doc-actions">

                    <input
                        type="file"
                        class="file-input"
                        id="archivo_${tipo.tipo}">

                    <button
                        class="btn-primary"
                        onclick="subirDocumento('${tipo.tipo}','${tipo.nombre}')">

                        SUBIR DOCUMENTO

                    </button>

                </div>

            `;

        }


        div.innerHTML=contenido;

        contenedor.appendChild(div);

    });

}


// SUBIR DOCUMENTO

async function subirDocumento(tipo,nombreTipo){

    const input =
    document.getElementById(
        "archivo_"+tipo
    );


    if(!input || !input.files.length){

        mostrarMensajeDocumento(
            "Selecciona un archivo primero.",
            false
        );

        return;
    }


    const archivo =
    input.files[0];


    if(archivo.size > 6 * 1024 * 1024){

        mostrarMensajeDocumento(
            "El archivo supera 6 MB. Para esta primera versión usaremos archivos pequeños.",
            false
        );

        return;
    }


    const extension =
    archivo.name.includes(".")
    ? archivo.name
        .split(".")
        .pop()
        .toLowerCase()
    : "bin";


    const nombreArchivo =
    tipo
    + "_"
    + Date.now()
    + "."
    + extension;


    const ruta =
    vehiculoActual.patente
    + "/"
    + nombreArchivo;


    mostrarMensajeDocumento(
        "Subiendo documento...",
        true
    );


    const {
        error:uploadError
    } = await supabaseClient
    .storage
    .from("documentos")
    .upload(
        ruta,
        archivo,
        {
            contentType:
            archivo.type ||
            "application/octet-stream",

            upsert:false
        }
    );


    if(uploadError){

        console.error(uploadError);

        mostrarMensajeDocumento(
            "Error al subir: "
            + uploadError.message,
            false
        );

        return;
    }


    // REGISTRAR EN LA TABLA

    const {
        error:dbError
    } = await supabaseClient
    .from("documentos")
    .insert({

        vehiculo_id:
        vehiculoActual.id,

        tipo:tipo,

        nombre:archivo.name,

        archivo:ruta,

        protegido:false

    });


    if(dbError){

        console.error(dbError);


        await supabaseClient
        .storage
        .from("documentos")
        .remove([ruta]);


        mostrarMensajeDocumento(
            "El archivo se subió, pero no pudo registrarse en la base de datos: "
            + dbError.message,
            false
        );

        return;
    }


    mostrarMensajeDocumento(
        nombreTipo
        + " subido correctamente.",
        true
    );


    cargarDocumentos();

}

    supabaseClient
    .storage
    .from("documentos")
    .getPublicUrl(ruta);


    if(data && data.publicUrl){

        window.open(
            data.publicUrl,
            "_blank"
