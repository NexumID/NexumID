<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexumID - Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05080d;color:#fff;font-family:Arial,sans-serif}
main{max-width:850px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:45px}
.logo{font-size:28px;font-weight:bold}.logo b{color:#1595ff}.sub{color:#9aa4b5;margin-top:5px}
h1{font-size:38px;font-weight:400}h2{font-size:28px;font-weight:400;margin-top:40px}
button{border:0;border-radius:14px;padding:16px 20px;cursor:pointer;font-size:16px}
.primary{background:#1595ff;color:white;font-weight:bold;width:100%}.secondary{background:#111923;color:white;border:1px solid #263342}
.card{background:#0d141d;border:1px solid #263342;border-radius:18px;padding:22px;margin-top:18px}
input{width:100%;padding:15px;margin:7px 0 17px;background:#080d13;border:1px solid #263342;border-radius:10px;color:white;font-size:16px}
label{color:#aeb8c7;font-size:14px}.loading{text-align:center;color:#9da8b8;padding:30px}
.error{background:#321414;border:1px solid #743030;color:#ff8888;padding:18px;border-radius:14px;margin:18px 0}
.success{background:#0d3026;border:1px solid #197553;color:#65e3b1;padding:18px;border-radius:14px;margin:18px 0}
.pin{font-size:38px;letter-spacing:8px;text-align:center;color:#fff;margin:15px}
.hidden{display:none}.actions{display:grid;gap:12px;margin-top:20px}
</style>
</head>
<body>
<main>

<div class="top">
<div>
<div class="logo">NEXUM<b>ID</b></div>
<div class="sub">IDENTIDAD DIGITAL VEHICULAR</div>
</div>
<button class="secondary" onclick="salir()">SALIR</button>
</div>

<section id="panel">
<h1>Panel de Administración</h1>
<div id="mensaje"></div>
<button class="primary" onclick="nuevo()">+ NUEVO VEHÍCULO</button>

<div id="form" class="card hidden">
<h2 style="margin-top:0">Nuevo vehículo</h2>
<label>Patente</label><input id="patente" placeholder="AB-CD-12">
<label>Marca</label><input id="marca" placeholder="Chevrolet">
<label>Modelo</label><input id="modelo" placeholder="Sail">
<label>Año</label><input id="anio" type="number" placeholder="2020">
<label>Color</label><input id="color" placeholder="Blanco">
<label>Contacto de emergencia</label><input id="contacto" placeholder="+56912345678">
<button class="primary" onclick="crear()">CREAR VEHÍCULO</button>
<br><br>
<button class="secondary" style="width:100%" onclick="cancelar()">CANCELAR</button>
</div>

<h2>Vehículos registrados</h2>
<div id="lista"><div class="loading">Iniciando panel...</div></div>
</section>

</main>

<script>
const URL="https://tkrugleneazdeqhxxkvr.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrcnVnbGVuZWF6ZGVxaHh4a3ZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTA4NjEsImV4cCI6MjEwNDEyNjg2MX0.R6yXQ9Ld4YYYRK_Fct99q9udqF6gEVN3qw-iqgvoCoA";
let token=null;

function tokenSesion(){
 for(const s of [localStorage,sessionStorage]){
  for(let i=0;i<s.length;i++){
   const k=s.key(i);
   if(!k||!k.includes("auth-token"))continue;
   try{
    const x=JSON.parse(s.getItem(k));
    if(x.access_token)return x.access_token;
   }catch(e){}
  }
 }
 return null;
}

async function api(path,opt={}){
 if(!token)token=tokenSesion();
 if(!token)throw Error("No hay una sesión iniciada. Vuelve a admin.html.");
 const h=new Headers(opt.headers||{});
 h.set("apikey",KEY);h.set("Authorization","Bearer "+token);
 const r=await fetch(URL+"/rest/v1/"+path,{...opt,headers:h});
 const t=await r.text();let d;
 try{d=t?JSON.parse(t):null}catch(e){d=t}
 if(!r.ok)throw Error(d?.message||d?.hint||d?.details||"HTTP "+r.status);
 return d;
}

function nuevo(){document.getElementById("form").classList.remove("hidden")}
function cancelar(){document.getElementById("form").classList.add("hidden")}

function mensaje(t,tipo="error"){
 document.getElementById("mensaje").innerHTML='<div class="'+tipo+'">'+t+"</div>";
}

async function cargar(){
 const lista=document.getElementById("lista");
 try{
  lista.innerHTML='<div class="loading">Cargando vehículos...</div>';
  token=tokenSesion();
  if(!token)throw Error("No encontramos la sesión. Vuelve a iniciar sesión.");
  const vs=await api("vehiculos?select=*&order=created_at.desc");
  if(!vs.length){lista.innerHTML='<div class="loading">No hay vehículos registrados.</div>';return}
  lista.innerHTML="";
  vs.forEach(v=>{
   const d=document.createElement("div");d.className="card";
   d.innerHTML="<strong style='font-size:30px;color:#1595ff'>"+esc(v.patente)+"</strong>"+
   "<div style='font-size:20px;margin-top:8px'>"+esc(v.marca)+" "+esc(v.modelo)+"</div>"+
   "<div style='color:#9da8b8;margin-top:8px'>Año: "+esc(v.anio)+"<br>Color: "+esc(v.color)+"</div>";
   lista.appendChild(d);
  });
 }catch(e){
  lista.innerHTML='<div class="error"><strong>Error:</strong><br><br>'+esc(e.message)+"</div>";
 }
}

async function crear(){
 try{
  const v={
   patente:val("patente").toUpperCase(),
   marca:val("marca"),modelo:val("modelo"),
   anio:parseInt(val("anio")),color:val("color"),
   contacto_emergencia:val("contacto")
  };
  if(!v.patente||!v.marca||!v.modelo||!v.anio||!v.color)throw Error("Completa los campos obligatorios.");
  const r=await api("vehiculos",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify(v)});
  const veh=Array.isArray(r)?r[0]:r;
  const pin=String(Math.floor(1000+Math.random()*9000));
  const hash=await sha(pin);
  await api("vehiculo_acceso",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({vehiculo_id:veh.id,pin_hash:hash,intentos:0,bloqueado_hasta:null})});
  mensaje("✓ VEHÍCULO CREADO<div class='pin'>"+pin+"</div>Guarda este PIN para el propietario.","success");
  ["patente","marca","modelo","anio","color","contacto"].forEach(x=>document.getElementById(x).value="");
  cancelar();cargar();
 }catch(e){mensaje(esc(e.message))}
}

function val(id){return document.getElementById(id).value.trim()}

async function sha(t){
 const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
 return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}

function esc(x){
 return String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function salir(){
 for(const s of [localStorage,sessionStorage]){
  const a=[];
  for(let i=0;i<s.length;i++){const k=s.key(i);if(k&&k.includes("auth-token"))a.push(k)}
  a.forEach(k=>s.removeItem(k));
 }
 location.href="admin.html";
}

cargar();
</script>
</body>
</html>
